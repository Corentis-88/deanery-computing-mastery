<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Bits require an agreed representation</title><desc id="desc">The same bit patterns can be interpreted as integer, text, image pixels or sampled sound depending on agreed encoding and metadata.</desc>
  <rect width="900" height="430" rx="28" fill="#f4f8fb"/>
  <g font-family="Segoe UI, sans-serif">
    <rect x="285" y="36" width="330" height="90" rx="18" fill="#10253f"/><text x="450" y="78" text-anchor="middle" fill="#f0b429" font-size="31" font-weight="700">0100 0001</text><text x="450" y="106" text-anchor="middle" fill="white" font-size="16">a pattern of eight bits</text>
    <path d="M450 126v45M430 160 155 230M450 160l0 70M470 160l275 70" fill="none" stroke="#007f78" stroke-width="6"/>
    <g text-anchor="middle">
      <rect x="45" y="230" width="210" height="135" rx="18" fill="#d8f1ec" stroke="#007f78" stroke-width="3"/><text x="150" y="270" fill="#10253f" font-size="23" font-weight="700">INTEGER</text><text x="150" y="310" fill="#10253f" font-size="34">65</text><text x="150" y="340" fill="#10253f" font-size="15">unsigned binary place value</text>
      <rect x="345" y="230" width="210" height="135" rx="18" fill="#fff0bf" stroke="#f0b429" stroke-width="3"/><text x="450" y="270" fill="#10253f" font-size="23" font-weight="700">CHARACTER</text><text x="450" y="310" fill="#10253f" font-size="34">A</text><text x="450" y="340" fill="#10253f" font-size="15">using the ASCII mapping</text>
      <rect x="645" y="230" width="210" height="135" rx="18" fill="#e8eef5" stroke="#173b62" stroke-width="3"/><text x="750" y="270" fill="#10253f" font-size="23" font-weight="700">PIXELS / SOUND</text><rect x="700" y="292" width="24" height="24" fill="#10253f"/><rect x="728" y="292" width="24" height="24" fill="#007f78"/><rect x="756" y="292" width="24" height="24" fill="#f0b429"/><text x="750" y="340" fill="#10253f" font-size="15">meaning comes from format context</text>
    </g>
    <text x="450" y="405" text-anchor="middle" fill="#5b687a" font-size="17">Bits store patterns. Encoding rules and metadata give those patterns meaning.</text>
  </g>
</svg>
