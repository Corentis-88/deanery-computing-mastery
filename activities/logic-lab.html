<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boolean logic lab</title><style>
body{font:18px/1.5 system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem;color:#142033;background:#f6f4ee}fieldset{background:white;border:1px solid #ccc;border-radius:14px;padding:1rem;margin:1rem 0}label{margin-right:1.2rem}select,button{font:inherit;padding:.5rem}output{display:block;font-size:2rem;font-weight:800;color:#007f78;margin-top:1rem}table{border-collapse:collapse;width:100%;background:white}th,td{padding:.5rem;border-bottom:1px solid #ccc;text-align:center}</style></head>
<body><h1>Boolean logic lab</h1><p>Choose inputs and a gate, predict the output, then check. Build the full truth table on paper before using the reveal.</p>
<fieldset><legend>Inputs and gate</legend><label>A <select id="a"><option value="0">0</option><option value="1">1</option></select></label><label>B <select id="b"><option value="0">0</option><option value="1">1</option></select></label><label>Gate <select id="gate"><option>AND</option><option>OR</option><option>XOR</option><option>NOT A</option></select></label><button id="check">Check output</button><output id="result" aria-live="polite">?</output></fieldset>
<button id="reveal">Reveal current gate truth table</button><div id="table"></div>
<script>const a=document.querySelector('#a'),b=document.querySelector('#b'),gate=document.querySelector('#gate'),result=document.querySelector('#result'),table=document.querySelector('#table');function solve(x,y,g){return g==='AND'?x&&y:g==='OR'?x||y:g==='XOR'?x!==y:!x}document.querySelector('#check').onclick=()=>result.value=Number(solve(+a.value,+b.value,gate.value));document.querySelector('#reveal').onclick=()=>{const rows=[[0,0],[0,1],[1,0],[1,1]];table.innerHTML='<table><thead><tr><th>A</th><th>B</th><th>'+gate.value+'</th></tr></thead><tbody>'+rows.map(([x,y])=>'<tr><td>'+x+'</td><td>'+y+'</td><td>'+Number(solve(x,y,gate.value))+'</td></tr>').join('')+'</tbody></table>'}</script></body></html>
